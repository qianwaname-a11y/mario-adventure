<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>超级冒险 - 像素马里奥</title>
<style>
  :root { --bg:#5c94fc; --text:#fff; --gold:#ffd700; --danger:#ff4444; }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#000; overflow:hidden; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none;
    user-select:none; font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    height:100dvh; width:100vw;
  }

  canvas { display:block; position:absolute; top:0; left:0; image-rendering:pixelated; image-rendering:crisp-edges; }

  /* HUD */
  #hud {
    position:fixed; top:0; left:0; right:0; padding:10px 14px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10; gap:8px;
  }
  .hud-item {
    background:rgba(0,0,0,0.6); border:2px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:6px 14px; color:var(--text); text-align:center;
    font-family:'Press Start 2P','Microsoft YaHei',monospace;
  }
  .hud-label { font-size:9px; opacity:0.7; letter-spacing:0.05em; }
  .hud-value { font-size:18px; font-weight:700; color:var(--gold); margin-top:2px; }

  /* Overlays */
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:100;
    pointer-events:none; opacity:0; transition:opacity 0.3s;
  }
  .overlay.active { opacity:1; pointer-events:auto; }

  .overlay-card {
    background:rgba(0,0,0,0.88); border:3px solid #fff;
    border-radius:12px; padding:32px 28px; text-align:center;
    max-width:360px; width:90%; box-shadow:0 8px 40px rgba(0,0,0,0.6);
  }
  .overlay-card h1 { font-size:28px; color:var(--gold); margin-bottom:4px; }
  .overlay-card .pixel-icon { font-size:56px; display:block; margin-bottom:8px; }
  .overlay-card .subtitle { font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:20px; }
  .overlay-card .stat-row { display:flex; justify-content:center; gap:24px; margin-bottom:16px; }
  .overlay-card .stat-num { font-size:24px; font-weight:700; color:var(--gold); }
  .overlay-card .stat-label { font-size:11px; color:rgba(255,255,255,0.5); }

  /* Level select */
  .world-grid { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; width:100%; }
  .world-btn {
    background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15);
    border-radius:8px; padding:10px 14px; color:#fff; cursor:pointer;
    font-family:inherit; text-align:left; display:flex; align-items:center;
    gap:10px; transition:all 0.15s; font-size:13px; width:100%;
  }
  .world-btn:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.3); }
  .world-btn .w-icon { font-size:28px; flex-shrink:0; }
  .world-btn .w-info { flex:1; }
  .world-btn .w-name { font-weight:700; font-size:14px; margin-bottom:2px; }
  .world-btn .w-desc { font-size:11px; opacity:0.5; }
  .world-btn .w-badge { font-size:10px; padding:3px 8px; border-radius:4px; }
  .w-badge.easy { background:#4caf50; color:#fff; }
  .w-badge.medium { background:#ff9800; color:#fff; }
  .w-badge.hard { background:#f44336; color:#fff; }
  .w-badge.extreme { background:#9c27b0; color:#fff; }

  /* Level clear screen */
  .flag-icon { font-size:64px; display:block; animation: flagWave 0.6s ease-in-out infinite alternate; }
  @keyframes flagWave { from { transform:rotate(-5deg); } to { transform:rotate(5deg); } }
  .clear-bonus { color:#4caf50; font-size:14px; margin:4px 0; }

  .btn {
    display:inline-block; padding:14px 36px; border-radius:4px;
    font-size:15px; font-weight:700; cursor:pointer; border:none;
    transition:transform 0.1s; font-family:inherit;
    letter-spacing:0.04em; text-transform:uppercase;
  }
  .btn:active { transform:scale(0.93); }
  .btn-primary {
    background:#e52521; color:#fff;
    box-shadow:0 4px 0 #8b0000, 0 6px 16px rgba(229,37,33,0.4);
  }
  .btn-primary:active { box-shadow:0 2px 0 #8b0000, 0 3px 8px rgba(229,37,33,0.3); transform:translateY(2px); }
  .btn-small {
    display:inline-block; padding:8px 20px; border-radius:4px;
    font-size:12px; font-weight:700; cursor:pointer; border:none;
    font-family:inherit; color:#fff; background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3); transition:all 0.15s;
  }
  .btn-small:hover { background:rgba(255,255,255,0.25); }
  .tip { font-size:12px; color:rgba(255,255,255,0.45); margin-top:16px; line-height:1.6; }
  .tip kbd { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); border-radius:3px; padding:2px 7px; font-size:11px; }

  /* Settings panel */
  .setting-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:12px 0; color:#fff; font-size:14px; text-align:left; }
  .setting-row label { flex-shrink:0; min-width:60px; }
  .setting-row input[type=range] { flex:1; -webkit-appearance:none; height:8px; border-radius:4px; background:rgba(255,255,255,0.15); outline:none; }
  .setting-row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gold); cursor:pointer; border:2px solid #fff; }
  .setting-val { font-size:11px; opacity:0.6; min-width:32px; text-align:right; }
  .setting-hint { font-size:11px; color:rgba(255,255,255,0.4); text-align:center; margin-top:8px; }

  /* Mobile controls */
  #mobile-controls {
    position:fixed; bottom:50px; left:0; right:0; display:none;
    justify-content:space-between; align-items:flex-end;
    padding:0 16px; z-index:50; pointer-events:none;
  }
  @media (max-width:768px), (hover:none) {
    #mobile-controls { display:flex; }
    .hud-item { padding:4px 8px; border-radius:6px; }
    .hud-label { font-size:7px; }
    .hud-value { font-size:14px; margin-top:1px; }
    .overlay-card { padding:20px 16px; max-width:320px; }
    .overlay-card h1 { font-size:22px; }
    .setting-row { font-size:12px; gap:8px; margin:8px 0; }
    .setting-row label { min-width:48px; font-size:12px; }
    .ctrl-btn { width:62px; height:62px; font-size:26px; }
    .ctrl-btn.jump-btn { width:83px; height:83px; font-size:32px; }
  }
  .ctrl-group { display:flex; gap:8px; pointer-events:auto; }
  .ctrl-btn {
    width:72px; height:72px; border-radius:14px;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.25);
    color:#fff; font-size:30px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation;
  }
  .ctrl-btn:active { background:rgba(255,255,255,0.35); transform:scale(0.9); }
  .ctrl-btn.jump-btn {
    width:94px; height:94px; border-radius:50%;
    background:rgba(229,37,33,0.5); border-color:rgba(255,255,255,0.35);
    font-size:36px;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-item"><div class="hud-label">🪙 金币</div><div class="hud-value" id="coin-display">0</div></div>
  <div class="hud-item"><div class="hud-label">⭐ 分数</div><div class="hud-value" id="score-display">0</div></div>
  <div class="hud-item"><div class="hud-label">❤️ 生命</div><div class="hud-value" id="lives-display">❤️❤️❤️</div></div>
  <div class="hud-item"><div class="hud-label">🌍 距离</div><div class="hud-value" id="dist-display">0m</div></div>
  <div class="hud-item" id="btn-return" title="返回选关" style="pointer-events:auto;cursor:pointer"><div class="hud-label">🏠</div><div class="hud-value" style="font-size:12px;color:#fff">菜单</div></div>
  <div class="hud-item" id="btn-settings" title="设置" style="pointer-events:auto;cursor:pointer"><div class="hud-label">⚙️</div><div class="hud-value" style="font-size:12px;color:#fff">设置</div></div>
</div>

<!-- Mobile Controls -->
<div id="mobile-controls">
  <div class="ctrl-group">
    <button class="ctrl-btn" id="btn-left">◀</button>
    <button class="ctrl-btn" id="btn-right">▶</button>
  </div>
  <div class="ctrl-group">
    <button class="ctrl-btn jump-btn" id="btn-jump">⬆</button>
  </div>
</div>

<!-- Start / Level Select Screen -->
<div class="overlay active" id="start-screen">
  <div class="overlay-card">
    <span class="pixel-icon">🍄</span>
    <h1>超级冒险</h1>
    <p class="subtitle">选择你的冒险世界</p>
    <div class="world-grid" id="world-grid"></div>
    <p class="tip">⌨️ <kbd>← →</kbd> 移动 &nbsp; <kbd>空格</kbd> 跳跃<br>🦘 空中可二连跳 &nbsp; 🚩 到达旗帜通关</p>
  </div>
</div>

<!-- Level Clear -->
<div class="overlay" id="levelclear-screen">
  <div class="overlay-card">
    <span class="flag-icon">🚩</span>
    <h1>关卡通过！</h1>
    <p class="subtitle" id="clear-world-name"></p>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="clear-coins">0</div><div class="stat-label">🪙 金币</div></div>
      <div class="stat"><div class="stat-num" id="clear-score">0</div><div class="stat-label">⭐ 分数</div></div>
      <div class="stat"><div class="stat-num" id="clear-time">0s</div><div class="stat-label">⏱ 用时</div></div>
    </div>
    <p class="clear-bonus" id="clear-bonus"></p>
    <button class="btn btn-primary" id="btn-next">下一关 ▶</button>
    <button class="btn btn-secondary" id="btn-back-menu">返回选关</button>
  </div>
</div>

<!-- Game Over -->
<div class="overlay" id="gameover-screen">
  <div class="overlay-card">
    <span class="pixel-icon">💀</span>
    <h1>游戏结束</h1>
    <p class="subtitle" id="death-msg"></p>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="final-coins">0</div><div class="stat-label">金币</div></div>
      <div class="stat"><div class="stat-num" id="final-score">0</div><div class="stat-label">分数</div></div>
      <div class="stat"><div class="stat-num" id="final-dist">0m</div><div class="stat-label">距离</div></div>
    </div>
    <button class="btn btn-primary" id="btn-restart">再来一关</button>
  </div>
</div>

<!-- Settings Panel -->
<div class="overlay" id="settings-screen">
  <div class="overlay-card">
    <span class="pixel-icon">⚙️</span>
    <h1>设置</h1>
    <div class="setting-row"><label>🎵 音乐</label><input type="range" id="bgm-vol" min="0" max="100" value="30"><span class="setting-val" id="bgm-vol-val">30%</span></div>
    <div class="setting-row"><label>🔊 音效</label><input type="range" id="sfx-vol" min="0" max="100" value="60"><span class="setting-val" id="sfx-vol-val">60%</span></div>
    <div class="setting-row"><label>🏃 移速</label><input type="range" id="speed-mult" min="50" max="300" value="100"><span class="setting-val" id="speed-mult-val">100%</span></div>
    <div class="setting-row"><label>🦘 跳跃</label><input type="range" id="jump-mult" min="50" max="200" value="100"><span class="setting-val" id="jump-mult-val">100%</span></div>
    <p class="setting-hint">拖动滑块调整参数 · 自动保存</p>
    <button class="btn-small" id="btn-close-settings" style="margin-top:14px">关闭</button>
  </div>
</div>

function getChunkKey(idx) { return Math.floor(idx); }

// Shorthand helpers
function G(c, sx, gy) { // ground tile
  c.blocks.push({x:sx, y:gy, w:TILE, h:TILE, type:'ground'});
  c.blocks.push({x:sx, y:gy+TILE, w:TILE, h:TILE, type:'ground_deep'});
}
function B(c, sx, sy) { c.blocks.push({x:sx, y:sy, w:TILE, h:TILE, type:'brick'}); }
function Q(c, sx, sy) { c.blocks.push({x:sx, y:sy, w:TILE, h:TILE, type:'question'}); }
function C(c, sx, sy, bob) { c.coins.push({x:sx+TILE/2, y:sy, collected:false, bobOffset:bob||0}); }
function E(c, sx, sy, dir) { c.enemies.push({x:sx, y:sy, w:TILE*0.8, h:TILE*0.8, vx:(dir||0.8), vy:0, alive:true, animTimer:0}); }
function P(c, sx, sy, h) { c.pipes.push({x:sx, y:sy, w:TILE*2, h:h*TILE, height:h}); }

function buildSegment(startX, segType) {
  const s = { blocks:[], coins:[], enemies:[], pipes:[] };
  const gy = groundY;
  const X = (tx) => startX + tx * TILE;

  // Ground helper: solid ground from tx=a to tx=b (inclusive)
  function ground(a, b) { for (let i=a; i<=b; i++) G(s, X(i), gy); }
  // Coin arc
  function coinArc(cx, cyTop, count, spread) {
    for (let i=0; i<count; i++) {
      const t = i/(count-1) - 0.5;
      C(s, cx + t*spread*TILE, cyTop + Math.abs(t)*TILE*2.5, i*0.8);
    }
  }

  switch(segType) {
    // ── 0: 平坦草地（教程）──
    case 0:
      ground(0, 17);
      C(s, X(5), gy-TILE*3.5, 0); C(s, X(6), gy-TILE*4.2, 0.8); C(s, X(7), gy-TILE*3.5, 1.6);
      Q(s, X(10), gy-TILE*3); B(s, X(11), gy-TILE*3); B(s, X(12), gy-TILE*3);
      C(s, X(10.5), gy-TILE*5, 2);
      break;

    // ── 1: 小台阶 + 金币弧 ──
    case 1:
      ground(0, 5); G(s, X(6), gy-TILE); ground(6, 17);
      G(s, X(7), gy-TILE); G(s, X(8), gy-TILE*2); G(s, X(9), gy-TILE*2);
      ground(10, 17);
      coinArc(X(6.5), gy-TILE*5.5, 5, 1.8);
      break;

    // ── 2: 水管地带 ──
    case 2:
      ground(0, 4); P(s, X(3), gy-TILE*2, 2);
      ground(5, 7); P(s, X(9), gy-TILE*3, 3);
      ground(8, 17);
      C(s, X(4)+TILE, gy-TILE*4, 0); C(s, X(10)+TILE, gy-TILE*5, 1);
      C(s, X(6), gy-TILE*3, 2); C(s, X(7), gy-TILE*2.5, 3);
      break;

    // ── 3: 2格缺口 + 浮台 ──
    case 3:
      ground(0, 5);
      B(s, X(7), gy-TILE*2); B(s, X(8), gy-TILE*2); B(s, X(9), gy-TILE*2);
      ground(10, 17);
      C(s, X(7.5), gy-TILE*4, 0); C(s, X(8.5), gy-TILE*4.5, 1.5);
      Q(s, X(8), gy-TILE*5);
      break;

    // ── 4: 敌人初遇 ──
    case 4:
      ground(0, 17);
      E(s, X(5), gy-TILE*0.9, 0.7); E(s, X(12), gy-TILE*0.9, -0.7);
      C(s, X(5), gy-TILE*3, 0); C(s, X(5.5), gy-TILE*3.5, 1); C(s, X(6), gy-TILE*3, 2);
      C(s, X(12), gy-TILE*3, 3); C(s, X(12.5), gy-TILE*3.5, 4); C(s, X(13), gy-TILE*3, 5);
      Q(s, X(8), gy-TILE*3); B(s, X(9), gy-TILE*3);
      break;

    // ── 5: 上升阶梯 ──
    case 5:
      ground(0, 1); G(s, X(2), gy-TILE); G(s, X(3), gy-TILE*2); G(s, X(4), gy-TILE*3);
      ground(4, 5);
      G(s, X(8), gy-TILE); G(s, X(9), gy-TILE*2); G(s, X(10), gy-TILE*3);
      ground(10, 17);
      coinArc(X(3.5), gy-TILE*5.5, 5, 2.0);
      coinArc(X(9.5), gy-TILE*5.5, 5, 2.0);
      break;

    // ── 6: 高平台挑战 ──
    case 6:
      ground(0, 3);
      B(s, X(5), gy-TILE*4); B(s, X(6), gy-TILE*4); B(s, X(7), gy-TILE*4);
      ground(9, 17);
      Q(s, X(6), gy-TILE*5);
      C(s, X(5.5), gy-TILE*6, 0); C(s, X(6.5), gy-TILE*6.5, 1.5);
      C(s, X(11), gy-TILE*3, 2); C(s, X(12), gy-TILE*3.5, 3);
      break;

    // ── 7: 砖墙迷宫 ──
    case 7:
      ground(0, 17);
      B(s, X(2), gy-TILE); B(s, X(2), gy-TILE*2); B(s, X(2), gy-TILE*3);
      B(s, X(5), gy-TILE); B(s, X(5), gy-TILE*2); B(s, X(5), gy-TILE*3);
      B(s, X(8), gy-TILE); B(s, X(8), gy-TILE*2); B(s, X(8), gy-TILE*3);
      B(s, X(11), gy-TILE); B(s, X(11), gy-TILE*2); B(s, X(14), gy-TILE); B(s, X(14), gy-TILE*2); B(s, X(14), gy-TILE*3);
      C(s, X(3), gy-TILE*2, 0); C(s, X(6), gy-TILE*2, 1); C(s, X(9), gy-TILE*2, 2);
      C(s, X(12), gy-TILE*2, 3); C(s, X(15), gy-TILE*2.5, 4);
      Q(s, X(10), gy-TILE*3);
      break;

    // ── 8: 双管齐下 ──
    case 8:
      ground(0, 4); P(s, X(3), gy-TILE*2, 2);
      ground(5, 8); P(s, X(8), gy-TILE*3, 3);
      ground(9, 17);
      C(s, X(4)+TILE, gy-TILE*4, 0); C(s, X(9)+TILE, gy-TILE*5.5, 1);
      C(s, X(6), gy-TILE*2.5, 2); C(s, X(7), gy-TILE*2, 3);
      Q(s, X(12), gy-TILE*3);
      E(s, X(14), gy-TILE*0.9, -0.6);
      break;

    // ── 9: 宽缺口 + 二连跳 ──
    case 9:
      ground(0, 4);
      ground(9, 17);
      B(s, X(6), gy-TILE*2); B(s, X(7), gy-TILE*2);
      C(s, X(6.5), gy-TILE*3.5, 0);
      C(s, X(11), gy-TILE*3, 1); C(s, X(12), gy-TILE*3.5, 2); C(s, X(13), gy-TILE*3, 3);
      Q(s, X(12), gy-TILE*5);
      break;

    // ── 10: 问号砖阵 ──
    case 10:
      ground(0, 17);
      Q(s, X(2), gy-TILE*3); Q(s, X(4), gy-TILE*3); Q(s, X(6), gy-TILE*3);
      Q(s, X(8), gy-TILE*3); Q(s, X(10), gy-TILE*3); Q(s, X(12), gy-TILE*3);
      C(s, X(3), gy-TILE*5, 0); C(s, X(5), gy-TILE*5.5, 1); C(s, X(7), gy-TILE*5, 2);
      C(s, X(9), gy-TILE*5.5, 3); C(s, X(11), gy-TILE*5, 4); C(s, X(13), gy-TILE*5.5, 5);
      E(s, X(15), gy-TILE*0.9, -0.7);
      break;

    // ── 11: 下降阶梯 ──
    case 11:
      G(s, X(1), gy-TILE*3); G(s, X(2), gy-TILE*3); G(s, X(3), gy-TILE*2); G(s, X(4), gy-TILE*2);
      G(s, X(5), gy-TILE); G(s, X(6), gy-TILE);
      ground(6, 17);
      coinArc(X(2), gy-TILE*5.5, 6, 2.2);
      E(s, X(9), gy-TILE*0.9, 0.7); E(s, X(15), gy-TILE*0.9, -0.8);
      break;

    // ── 12: 金币瀑布 ──
    case 12:
      ground(0, 17);
      for (let row=0; row<4; row++) {
        for (let col=0; col<8; col++) {
          C(s, X(3+col*1.5), gy-TILE*(2.5+row*1.8), row*2+col*0.3);
        }
      }
      Q(s, X(7), gy-TILE*3); Q(s, X(10), gy-TILE*3);
      break;

    // ── 13: 敌人走廊 ──
    case 13:
      ground(0, 17);
      E(s, X(3), gy-TILE*0.9, 0.8); E(s, X(7), gy-TILE*0.9, -0.8);
      E(s, X(11), gy-TILE*0.9, 0.7); E(s, X(15), gy-TILE*0.9, -0.7);
      // Safe coins above
      C(s, X(3.5), gy-TILE*3, 0); C(s, X(7.5), gy-TILE*3.5, 1);
      C(s, X(11.5), gy-TILE*3, 2); C(s, X(15.5), gy-TILE*3.5, 3);
      Q(s, X(9), gy-TILE*4);
      break;

    // ── 14: 城堡地带 ──
    case 14:
      ground(0, 1);
      // Castle wall structure
      B(s, X(3), gy-TILE); B(s, X(3), gy-TILE*2); B(s, X(3), gy-TILE*3); B(s, X(3), gy-TILE*4);
      B(s, X(4), gy-TILE); B(s, X(4), gy-TILE*2); B(s, X(4), gy-TILE*3); B(s, X(4), gy-TILE*4);
      B(s, X(5), gy-TILE*4);
      B(s, X(6), gy-TILE); B(s, X(6), gy-TILE*2); B(s, X(6), gy-TILE*3); B(s, X(6), gy-TILE*4);
      B(s, X(7), gy-TILE); B(s, X(7), gy-TILE*2); B(s, X(7), gy-TILE*3); B(s, X(7), gy-TILE*4);
      ground(9, 17);
      P(s, X(12), gy-TILE*2, 2);
      C(s, X(5), gy-TILE*5.5, 0); Q(s, X(5), gy-TILE*5);
      E(s, X(13), gy-TILE*0.9, -0.7);
      break;

    // ── 15: 奖励天堂 ──
    case 15:
      ground(0, 17);
      Q(s, X(2), gy-TILE*3); Q(s, X(4), gy-TILE*3); Q(s, X(6), gy-TILE*3);
      Q(s, X(10), gy-TILE*3); Q(s, X(12), gy-TILE*3); Q(s, X(14), gy-TILE*3);
      // Dense coin arcs
      coinArc(X(3), gy-TILE*5, 6, 2.5);
      coinArc(X(11), gy-TILE*5, 6, 2.5);
      C(s, X(0.5), gy-TILE*2, 0); C(s, X(17.5), gy-TILE*2, 1);
      break;
  }

  return s;
}

function ensureChunksGenerated() {
  const rightEdge = camera.x + W + TILE * 4;
  const maxSeg = Math.ceil(rightEdge / (SEGMENT_WIDTH * TILE)) + 1;
  const world = getCurrentWorld();

  for (let i = 0; i <= maxSeg; i++) {
    const key = getChunkKey(i);
    if (chunkData[key]) continue;
    // Use world-specific segments, cycling through the world's segment list
    const segList = world.segments;
    const segIdx = segList[i % segList.length];
    chunkData[key] = buildSegment(i * SEGMENT_WIDTH * TILE, segIdx);
  }
}

// ── Collision helpers ──────────────────
function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function getAllBlocks() {
  const blocks = [];
  const minChunk = Math.max(0, Math.floor((camera.x - TILE*4) / (SEGMENT_WIDTH * TILE)) - 1);
  const maxChunk = Math.ceil((camera.x + W + TILE*4) / (SEGMENT_WIDTH * TILE)) + 1;
  for (let i = minChunk; i <= maxChunk; i++) {
    const c = chunkData[getChunkKey(i)];
    if (c) blocks.push(...c.blocks);
  }
  return blocks;
}

function getAllPipes() {
  const pipes = [];
  const minChunk = Math.max(0, Math.floor((camera.x - TILE*4) / (SEGMENT_WIDTH * TILE)) - 1);
  const maxChunk = Math.ceil((camera.x + W + TILE*4) / (SEGMENT_WIDTH * TILE)) + 1;
  for (let i = minChunk; i <= maxChunk; i++) {
    const c = chunkData[getChunkKey(i)];
    if (c) pipes.push(...c.pipes);
  }
  return pipes;
}

function getAllCoins() {
  const coins = [];
  const minChunk = Math.max(0, Math.floor((camera.x - TILE*4) / (SEGMENT_WIDTH * TILE)) - 1);
  const maxChunk = Math.ceil((camera.x + W + TILE*4) / (SEGMENT_WIDTH * TILE)) + 1;
  for (let i = minChunk; i <= maxChunk; i++) {
    const c = chunkData[getChunkKey(i)];
    if (c) coins.push(...c.coins);
  }
  return coins;
}

function getAllEnemies() {
  const enemies = [];
  const minChunk = Math.max(0, Math.floor((camera.x - TILE*4) / (SEGMENT_WIDTH * TILE)) - 1);
  const maxChunk = Math.ceil((camera.x + W + TILE*4) / (SEGMENT_WIDTH * TILE)) + 1;
  for (let i = minChunk; i <= maxChunk; i++) {
    const c = chunkData[getChunkKey(i)];
    if (c) enemies.push(...c.enemies);
  }
  return enemies;
}

// ── Particles ──────────────────────────
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: rand(-2.5, 2.5),
      vy: rand(-5, -1),
      life: 1,
      decay: rand(0.02, 0.06),
      color,
      size: rand(3, 7),
    });
  }
}

// ── Initialize ─────────────────────────
function initGame() {
  player = createPlayer();
  if (gameState === "start" || lives <= 0) lives = 3;
  camera = createCamera();
  particles = [];
  score = 0;
  collectedCoins = 0;
  distance = 0;
  frameCount = 0;
  levelStartTime = Date.now();
  levelClearTriggered = false;
  pickups = [];
  chunkData = {};
  generatedUpTo = -1;
  segmentOrder = [];

  const world = WORLDS[currentWorldIdx];
  flagX = world.len * SEGMENT_WIDTH * TILE + FLAG_OFFSET;

  ensureChunksGenerated();
  preloadImages();
  updateHUD();
}


const loadedImages = {};
function preloadImages() {
  const imgDefs = {mario:IMG_MARIO, piranha:IMG_PIRANHA, mushroom:IMG_MUSHROOM, hearts:IMG_HEARTS, sprites:IMG_SPRITESHEET, tiles:IMG_TILESET};
  for (let [k,v] of Object.entries(imgDefs)) {
    if (!loadedImages[k]) {
      const img = new Image();
      img.src = v;
      loadedImages[k] = img;
    }
  }
}

function getCurrentWorld() { return WORLDS[currentWorldIdx]; }

function updateHUD() {
  coinDisplay.textContent = collectedCoins;
  scoreDisplay.textContent = score;
  document.getElementById("lives-display").textContent = "❤️".repeat(Math.max(0, lives)) || "💀";
  const remaining = flagX - player.x;
  const remainM = Math.max(0, Math.floor(remaining / TILE));
  distDisplay.textContent = remainM + 'm🚩';
}

// ── Update ─────────────────────────────
function update() {
  // Input
  let moveX = 0;
  if (keys['ArrowLeft'] || keys['KeyA'] || mobileLeft) moveX = -1;
  if (keys['ArrowRight'] || keys['KeyD'] || mobileRight) moveX = 1;

  const jumpPressed = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || mobileJump;

  // Player movement
  player.vx = moveX * PLAYER_SPEED * speedMult;
  if (moveX !== 0) player.facing = moveX;

  // ── Jump system with double jump & variable height ──
  const jumpJustPressed = (keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || mobileJump);
  const jumpHeld = jumpJustPressed;

  // Reset double jump on landing
  if (player.onGround) {
    player.doubleJumpUsed = false;
  }

  if (jumpJustPressed && !player.jumpHeld) {
    // Jump just pressed this frame
    if (player.onGround) {
      player.vy = PLAYER_JUMP * jumpMult;
      player.onGround = false; sfxJump();
      player.jumpHeld = true;
      player.doubleJumpUsed = false;
    } else if (!player.doubleJumpUsed) {
      // Double jump!
      player.vy = DOUBLE_JUMP_FORCE * jumpMult;
      player.doubleJumpUsed = true;
      player.jumpHeld = true;
      // Double jump particles
      const px = player.x + player.w/2 - camera.x;
      spawnParticles(player.x + player.w/2, player.y + player.h, '#ffffff', 6);
    }
  }

  // Variable jump height: release jump early = shorter jump
  if (!jumpHeld && player.jumpHeld && player.vy < 0) {
    player.vy *= VAR_JUMP_RELEASE;
  }
  player.jumpHeld = jumpHeld;

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 12) player.vy = 12; // terminal velocity

  // Move X
  player.x += player.vx;
  // Collision X
  const allBlocks = getAllBlocks();
  const allPipes = getAllPipes();
  for (let b of allBlocks) {
    if (rectsCollide(player, b)) {
      if (player.vx > 0) { player.x = b.x - player.w; }
      else if (player.vx < 0) { player.x = b.x + b.w; }
      player.vx = 0;
    }
  }
  for (let p of allPipes) {
    if (rectsCollide(player, p)) {
      if (player.vx > 0) { player.x = p.x - player.w; }
      else if (player.vx < 0) { player.x = p.x + p.w; }
      player.vx = 0;
    }
  }

  // Move Y
  player.y += player.vy;
  player.onGround = false;
  // Collision Y
  for (let b of allBlocks) {
    if (rectsCollide(player, b)) {
      if (player.vy > 0) {
        player.y = b.y - player.h;
        player.vy = 0;
        player.onGround = true;
        // Hit question block from below?
        if (b.type === 'question' && player.vy >= 0) {
          // Can only hit from below
        }
      } else if (player.vy < 0) {
        player.y = b.y + b.h;
        player.vy = 0;
        // Hit block from below
        if (b.type === 'question') {
          hitQuestionBlock(b);
        }
      }
    }
  }
  for (let p of allPipes) {
    if (rectsCollide(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
      }
    }
  }

  // Fall death
  if (player.y > H + 100) {
    if (!player.dead) killPlayer('掉入深渊');
    return;
  }

  // Animation
  if (player.onGround && Math.abs(player.vx) > 0.5) {
    player.animTimer++;
    if (player.animTimer > 6) { player.animTimer = 0; player.animFrame = (player.animFrame + 1) % 4; }
  } else if (player.onGround) {
    player.animFrame = 0;
    player.animTimer = 0;
  } else {
    player.animFrame = 2; // jump frame
  }

  // Invincibility
  if (player.invincible > 0) player.invincible--;

  // Camera follows player
  const targetCamX = player.x - W * 0.35;
  camera.x += (targetCamX - camera.x) * 0.1;
  if (camera.x < 0) camera.x = 0;

  // Clamp player left
  if (player.x < 0) player.x = 0;

  // Ensure chunks
  ensureChunksGenerated();

  // Update enemies
  const enemies = getAllEnemies();
  for (let e of enemies) {
    if (!e.alive) continue;
    // Only update if near screen
    if (e.x < camera.x - TILE*2 || e.x > camera.x + W + TILE*2) continue;

    e.animTimer++;
    e.x += e.vx;
    e.vy += GRAVITY;
    e.y += e.vy;

    // Enemy ground collision
    let eOnGround = false;
    for (let b of allBlocks) {
      if (rectsCollide(e, b)) {
        if (e.vy > 0) { e.y = b.y - e.h; e.vy = 0; eOnGround = true; }
        else if (e.vy < 0) { e.y = b.y + b.h; e.vy = 0; }
      }
    }
    // Enemy pipe collision
    for (let p of allPipes) {
      if (rectsCollide(e, p)) {
        if (e.vy > 0) { e.y = p.y - e.h; e.vy = 0; eOnGround = true; }
        else if (e.vy < 0) { e.y = p.y + p.h; e.vy = 0; }
      } else {
        // Turn around at pipe edge if on ground
        if (eOnGround && e.y + e.h >= p.y && e.y <= p.y + p.h) {
          if (e.x + e.w > p.x && e.x < p.x && e.vx > 0) e.vx *= -1;
          if (e.x < p.x + p.w && e.x + e.w > p.x + p.w && e.vx < 0) e.vx *= -1;
        }
      }
    }
    // Fall off screen
    if (e.y > H + 100) e.alive = false;
    // Reverse at edges where no ground ahead
    if (eOnGround) {
      const aheadX = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      let groundAhead = false;
      for (let b of allBlocks) {
        if (aheadX >= b.x && aheadX <= b.x + b.w && e.y + e.h + 2 >= b.y && e.y + e.h <= b.y + TILE) {
          groundAhead = true; break;
        }
      }
      if (!groundAhead) e.vx *= -1;
    }

    // Player collision
    if (player.invincible <= 0 && rectsCollide(player, e)) {
      if (player.vy > 0 && player.y + player.h - e.y < TILE * 0.4) {
        // Stomp!
        e.alive = false; sfxStomp();
        player.vy = -6;
        score += STOMP_SCORE;
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ff9944', 10);
      } else {
        // Hit by enemy
        killPlayer('被敌人撞到了');
        return;
      }
    }
  }

  // Check coins
  const coins = getAllCoins();
  for (let c of coins) {
    if (c.collected) continue;
    if (c.x < camera.x - TILE*2 || c.x > camera.x + W + TILE*2) continue;
    const dx = player.x + player.w/2 - c.x;
    const dy = player.y + player.h/2 - c.y;
    if (Math.abs(dx) < TILE*0.6 && Math.abs(dy) < TILE*0.6) {
      c.collected = true;
      collectedCoins++; sfxCoin();
      score += COIN_SCORE;
      spawnParticles(c.x, c.y, '#ffd700', 6);
    }
  }

  // ── Flag collision ──
  if (!levelClearTriggered && flagX && player.x + player.w > flagX) {
    levelClearTriggered = true;
    lives = 3; updateHUD(); sfxLevelClear();
    const elapsed = Math.floor((Date.now() - levelStartTime) / 1000);
    const bonus = Math.floor((flagX - camera.x) / TILE) * 10;
    score += bonus + 500;
    document.getElementById('clear-world-name').textContent = getCurrentWorld().name;
    document.getElementById('clear-coins').textContent = collectedCoins;
    document.getElementById('clear-score').textContent = score;
    document.getElementById('clear-time').textContent = elapsed + 's';
    document.getElementById('clear-bonus').textContent = '🏆 剩余距离加成 +' + bonus;
    setTimeout(() => { levelClearScreen.classList.add('active'); gameState = 'levelclear'; }, 600);
    spawnParticles(flagX, groundY - TILE*5, '#ffd700', 30);
    spawnParticles(flagX, groundY - TILE*3, '#ff4444', 20);
    spawnParticles(flagX, groundY - TILE*4, '#44ff44', 20);
  }

  // Update pickups
  for (let p of pickups) {
    if (p.collected) continue;
    p.animTimer++;
    p.vy += 0.25;
    p.y += p.vy;
    p.x += p.vx;
    p.life--;
    if (rectsCollide(player, p)) {
      p.collected = true;
      if (p.type === 'coin') {
        collectedCoins++; score += p.score; sfxCoin();
        spawnParticles(p.x + p.w/2, p.y + p.h/2, '#ffd700', 10);
      } else if (p.type === 'mushroom') {
        score += p.score;
        if (lives < 5) { lives++; updateHUD(); }
        sfxCoin();
        spawnParticles(p.x + p.w/2, p.y + p.h/2, '#ff6347', 14);
      }
    }
  }
  pickups = pickups.filter(p => !p.collected && p.life > 0);

  // Update particles
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  // Distance
  distance = Math.max(distance, player.x);

  updateHUD();
}

function hitQuestionBlock(block) {
  if (block.type === 'used') return;
  block.type = 'used';
  sfxBlockHit();
  const cx = block.x + TILE/2;
  const cy = block.y - TILE;
  // Spawn a pickup popping out of the block
  const r = Math.random();
  let ptype, pcolor, pscore;
  if (r < 0.15) {
    ptype = 'mushroom'; pcolor = '#ff6347'; pscore = 1000;
  } else {
    ptype = 'coin'; pcolor = '#ffd700'; pscore = 200;
  }
  pickups.push({
    x: cx - TILE*0.35, y: cy - TILE*0.5,
    w: TILE*0.7, h: TILE*0.7,
    vy: -6.0, vx: (Math.random() - 0.5) * 1.5,
    type: ptype, score: pscore, color: pcolor,
    life: 300, collected: false,
    animTimer: 0
  });
  spawnParticles(cx, cy, '#ffd700', 6);
  block.bounceTimer = 8;
}

function killPlayer(msg) {
  if (player.dead) return;
  player.dead = true; sfxHurt();
  lives--;
  updateHUD();
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#ff4444', 15);
  if (lives <= 0) {
    gameState = 'gameover';
    sfxDeath(); stopBGM();
    deathMsg.textContent = msg;
    finalCoins.textContent = collectedCoins;
    finalScore.textContent = score;
    finalDist.textContent = Math.floor(distance / TILE) + 'm';
    gameoverScreen.classList.add('active');
    lives = 3;
  } else {
    setTimeout(() => {
      player.dead = false;
      player.y = groundY - TILE * 3;
      player.x = Math.max(0, player.x - TILE * 4);
      player.vy = 0; player.vx = 0;
      player.invincible = 90;
      player.onGround = false;
      player.doubleJumpUsed = false;
    }, 400);
  }
}

// ── Rendering ──────────────────────────
function drawPixelBlock(ctx, x, y, w, h, color, borderColor) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  // Pixel borders
  ctx.fillStyle = borderColor || 'rgba(0,0,0,0.3)';
  ctx.fillRect(x, y, w, 2); // top
  ctx.fillRect(x, y, 2, h); // left
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x, y + h - 2, w, 2); // bottom
  ctx.fillRect(x + w - 2, y, 2, h); // right
}

function drawBlock(ctx, block, camX) {
  const x = block.x - camX;
  const y = block.y;
  if (x < -TILE || x > W + TILE) return;

  let bounceY = 0;
  if (block.bounceTimer > 0) {
    bounceY = -Math.sin(block.bounceTimer * 0.8) * 6;
    block.bounceTimer--;
  }

  const by = y + bounceY;

  switch (block.type) {
    case 'ground': {
      const w = getCurrentWorld();
      ctx.fillStyle = w.ground;
      ctx.fillRect(x, by, TILE, TILE);
      ctx.fillStyle = w.id === 4 ? '#b8c8d8' : (w.id === 1 ? '#3a2a1a' : '#6b3f1f');
      ctx.fillRect(x, by, TILE, 3);
      ctx.fillStyle = w.grass;
      ctx.fillRect(x, by, TILE, 6);
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(x + 4, by + 10, 4, 4);
      ctx.fillRect(x + 16, by + 16, 4, 4);
      ctx.fillRect(x + 24, by + 8, 3, 3);
      break; }
    case 'ground_deep': {
      const w = getCurrentWorld();
      ctx.fillStyle = w.id === 1 ? '#3a2a1a' : (w.id === 4 ? '#a8b8c8' : '#6b3f1f');
      ctx.fillRect(x, by, TILE, TILE);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(x + 8, by + 4, 3, 3);
      ctx.fillRect(x + 22, by + 14, 4, 4);
      break; }
    case 'brick':
      drawPixelBlock(ctx, x, by, TILE, TILE, '#c84c09', '#8b3000');
      // Brick lines
      ctx.fillStyle = '#8b3000';
      ctx.fillRect(x, by + TILE/2 - 1, TILE, 2);
      ctx.fillRect(x + TILE/2 - 1, by, 2, TILE/2);
      ctx.fillRect(x + TILE/4, by + TILE/2, 2, TILE/2);
      ctx.fillRect(x + TILE*3/4, by + TILE/2, 2, TILE/2);
      break;
    case 'question':
      drawPixelBlock(ctx, x, by, TILE, TILE, '#f0b028', '#b87818');
      // "?" mark
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px "Press Start 2P","Microsoft YaHei",monospace';
      ctx.textAlign = 'center';
      ctx.fillText('?', x + TILE/2, by + TILE/2 + 7);
      break;
    case 'used':
      drawPixelBlock(ctx, x, by, TILE, TILE, '#5c4c3c', '#3a2c20');
      break;
  }
}

function drawPlayer(ctx) {
  if (player.dead) return;
  if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) return;

  const x = Math.floor(player.x - camera.x);
  const y = Math.floor(player.y);
  const img = loadedImages['mario'];
  const spriteImg = loadedImages['sprites'];

  ctx.save();
  if (player.facing < 0) {
    ctx.translate(x + player.w, y);
    ctx.scale(-1, 1);
  } else {
    ctx.translate(x, y);
  }

  if (spriteImg && spriteImg.complete && spriteImg.naturalWidth > 0) {
    // Use spritesheet: 4 cols x 3 rows
    const fw = spriteImg.naturalWidth / 4;
    const fh = spriteImg.naturalHeight / 3;
    let col = 0, row = 1; // default: middle row, stand
    if (player.onGround) {
      col = Math.abs(player.vx) > 0.5 ? (player.animFrame % 4) : 0;
      row = 0;
    } else {
      row = 1; // jump row
      col = Math.min(3, Math.floor(Math.abs(player.vy) / 3));
    }
    ctx.drawImage(spriteImg, col * fw, row * fh, fw, fh, 0, 0, player.w, player.h);
  } else if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, player.w, player.h);
  } else {
    // Pixel fallback
    const w = player.w, h = player.h;
    ctx.fillStyle = '#e52521'; ctx.fillRect(w*0.04, h*0.0, w*0.92, h*0.10); // cap
    ctx.fillStyle = '#e8c8a0'; ctx.fillRect(w*0.08, h*0.0, w*0.84, h*0.18); // face
    ctx.fillStyle = '#e52521'; ctx.fillRect(w*0.08, h*0.15, w*0.84, h*0.22); // shirt
    ctx.fillStyle = '#2040a0'; ctx.fillRect(w*0.08, h*0.35, w*0.84, h*0.42); // overalls
    ctx.fillStyle = '#000'; ctx.fillRect(w*0.55, h*0.04, w*0.12, h*0.08); // eye
  }
  ctx.restore();
}

function drawEnemy(ctx, e, camX) {
  if (!e.alive) return;
  const x = e.x - camX;
  const y = e.y;
  if (x < -TILE || x > W + TILE) return;
  const img = loadedImages['mushroom'];
  if (img && img.complete && img.naturalWidth > 0) {
    const bob = Math.sin(e.animTimer * 0.08) * 2;
    ctx.drawImage(img, x - 2, y + bob - 2, e.w + 4, e.h + 4);
  } else {
    // Pixel fallback - mushroom
    const w = e.w, h = e.h;
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h*0.2, w*0.52, h*0.35, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillRect(x + w*0.05, y + h*0.05, w*0.9, h*0.2);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x + w*0.30, y + h*0.10, w*0.12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w*0.65, y + h*0.08, w*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + w*0.48, y + h*0.18, w*0.09, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f5deb3';
    ctx.fillRect(x + w*0.25, y + h*0.35, w*0.5, h*0.45);
    ctx.fillStyle = '#000';
    ctx.fillRect(x + w*0.30, y + h*0.42, w*0.10, h*0.10);
    ctx.fillRect(x + w*0.58, y + h*0.42, w*0.10, h*0.10);
  }
}

function drawCoin(ctx, c, camX) {
  if (c.collected) return;
  const x = c.x - camX;
  if (x < -TILE || x > W + TILE) return;

  const bob = Math.sin(frameCount * 0.06 + c.bobOffset) * 4;
  const cy = c.y + bob;
  const r = TILE * 0.22;
  const spin = Math.abs(Math.cos(frameCount * 0.05 + c.bobOffset));
  const sw = r * 2 * spin;

  // Coin
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.ellipse(x, cy, sw, r, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Coin face (only when visible enough)
  if (spin > 0.3) {
    ctx.fillStyle = '#ffec8b';
    ctx.font = `${r*1.1}px "Microsoft YaHei"`;
    ctx.textAlign = 'center';
    ctx.fillText('$', x, cy + r*0.35);
  }
}

function drawPipe(ctx, pipe, camX) {
  const x = pipe.x - camX;
  const y = pipe.y;
  if (x < -TILE*3 || x > W + TILE*3) return;

  const w = pipe.w, h = pipe.h;

  // Pipe body
  ctx.fillStyle = '#3cb043';
  ctx.fillRect(x + 2, y, w - 4, h);

  // Pipe shading
  ctx.fillStyle = '#2d8a33';
  ctx.fillRect(x + 2, y, w/2 - 2, h);
  ctx.fillStyle = '#4cd854';
  ctx.fillRect(x + w/2 + 1, y, w/2 - 3, h);

  // Pipe rim
  ctx.fillStyle = '#3cb043';
  ctx.fillRect(x, y, w, TILE*0.35);
  ctx.fillStyle = '#4cd854';
  ctx.fillRect(x, y, w/2 - 2, TILE*0.35);
  ctx.fillStyle = '#2d8a33';
  ctx.fillRect(x + w/2 - 2, y, w/2 + 2, TILE*0.35);

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x + w*0.2, y + 4, w*0.1, h - 8);
}

function drawParticle(ctx, p, camX) {
  const x = p.x - camX;
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.fillRect(x, p.y, p.size, p.size);
  ctx.globalAlpha = 1;
}

function drawFlag(ctx, fx, camX) {
  const x = fx - camX;
  if (x < -TILE*3 || x > W + TILE*3) return;
  const poleX = x;
  const poleTop = groundY - TILE * 6;
  const poleBot = groundY + TILE;

  // Flag shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(poleX + 6, groundY + 4, 8, 4);

  // Pole
  ctx.fillStyle = '#888';
  ctx.fillRect(poleX, poleTop, 6, poleBot - poleTop);
  ctx.fillStyle = '#aaa';
  ctx.fillRect(poleX, poleTop, 2, poleBot - poleTop);

  // Ball on top
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(poleX + 3, poleTop, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(poleX + 1, poleTop - 3, 3, 0, Math.PI * 2);
  ctx.fill();

  // Flag banner
  const wave = Math.sin(frameCount * 0.06) * 3;
  const flagW = 28, flagH = 22;
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(poleX + 4, poleTop + 10);
  ctx.lineTo(poleX + 4 + flagW + wave, poleTop + 10 + flagH / 2);
  ctx.lineTo(poleX + 4, poleTop + 10 + flagH);
  ctx.closePath();
  ctx.fill();

  // Flag star
  ctx.fillStyle = '#ffd700';
  ctx.font = '14px serif';
  ctx.textAlign = 'center';
  ctx.fillText('⭐', poleX + 4 + flagW/2 + wave/2, poleTop + 10 + flagH/2 + 5);

  // Clear sparkle
  if (levelClearTriggered) {
    ctx.fillStyle = `rgba(255,215,0,${0.3 + Math.sin(frameCount*0.15)*0.3})`;
    ctx.beginPath();
    ctx.arc(poleX + 3, poleTop + 20, 20 + Math.sin(frameCount*0.1)*5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBackground(ctx) {
  const world = getCurrentWorld();
  // Sky gradient - world themed
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, world.bgTop);
  skyGrad.addColorStop(0.6, world.bgMid);
  skyGrad.addColorStop(1, world.bgBot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Clouds (parallax) - skip for underground/fire worlds
  if (world.id !== 1 && world.id !== 3) {
    ctx.fillStyle = 'rgba(255,255,255,' + (world.id === 2 ? '0.9' : '0.6') + ')';
    for (let i = 0; i < (world.id === 2 ? 12 : 6); i++) {
      const cx = (i * 250 + 80) - (camera.x * 0.2) % (W + 500);
      const cy = 40 + i * 35;
      ctx.fillRect(cx, cy, 60, 16);
      ctx.fillRect(cx + 14, cy - 10, 32, 14);
      ctx.fillRect(cx + 24, cy - 16, 20, 8);
    }
  }

  // Underground stalactites / fire embers
  if (world.id === 1) {
    ctx.fillStyle = 'rgba(60,50,40,0.6)';
    for (let i = 0; i < 5; i++) {
      const sx = (i * 200 + 60) - (camera.x * 0.1) % (W + 400);
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx + 20, 40 + i*10);
      ctx.lineTo(sx - 20, 40 + i*10);
      ctx.fill();
    }
  }
  if (world.id === 3) {
    ctx.fillStyle = 'rgba(255,100,20,0.5)';
    for (let i = 0; i < 8; i++) {
      const ex = (i * 170 + 30) - (camera.x * 0.15) % (W + 340);
      const ey = (i * 130 + 60) % H;
      ctx.fillRect(ex, ey, 4, 4);
      ctx.fillRect(ex + 2, ey - 2, 2, 2);
    }
  }

  // Hills (parallax)
  ctx.fillStyle = world.hill;
  for (let i = 0; i < 8; i++) {
    const hx = (i * 180 + 40) - (camera.x * 0.3) % (W + 360);
    ctx.beginPath();
    ctx.arc(hx + 50, groundY, 60 + i*8, Math.PI, 0);
    ctx.fill();
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawBackground(ctx);

  const camX = Math.floor(camera.x);

  // Blocks
  const blocks = getAllBlocks();
  for (let b of blocks) drawBlock(ctx, b, camX);

  // Pipes
  const pipes = getAllPipes();
  for (let p of pipes) drawPipe(ctx, p, camX);

  // Coins
  const coins = getAllCoins();
  for (let c of coins) drawCoin(ctx, c, camX);

  // Pickups
  for (let p of pickups) {
    if (p.collected) continue;
    const px = p.x - camera.x;
    if (px < -TILE || px > W + TILE) continue;
    if (p.type === 'coin') {
      const bob = Math.sin(p.animTimer * 0.1) * 3;
      const cy = p.y + bob;
      const spin = Math.abs(Math.cos(p.animTimer * 0.08));
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.ellipse(px + p.w/2, cy + p.h/2, p.w/2 * spin, p.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#daa520'; ctx.lineWidth = 1.5;
      ctx.stroke();
    } else if (p.type === 'mushroom') {
      const mimg = loadedImages['mushroom'];
      if (mimg && mimg.complete && mimg.naturalWidth > 0) {
        ctx.drawImage(mimg, px, p.y, p.w, p.h);
      } else {
        ctx.fillStyle = '#ff6347';
        ctx.beginPath();
        ctx.ellipse(px + p.w/2, p.y + p.h*0.3, p.w*0.48, p.h*0.3, 0, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(px + p.w*0.04, p.y + p.h*0.1, p.w*0.92, p.h*0.25);
        ctx.fillStyle = '#ffdead';
        ctx.fillRect(px + p.w*0.2, p.y + p.h*0.35, p.w*0.6, p.h*0.45);
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(px + p.w*0.3, p.y + p.h*0.1, p.w*0.1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + p.w*0.65, p.y + p.h*0.08, p.w*0.08, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  // Enemies
  const enemies = getAllEnemies();
  for (let e of enemies) drawEnemy(ctx, e, camX);

  // Flag
  if (flagX) drawFlag(ctx, flagX, camX);

  // Player
  if (gameState !== 'gameover') drawPlayer(ctx);

  // Particles
  for (let p of particles) drawParticle(ctx, p, camX);

  // Ground line shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(0, groundY + TILE, W, 3);
}

// ── Game Loop ──────────────────────────
function gameLoop() {
  if (gameState === 'playing') update();
  frameCount++;

  // Also update particles in gameover/levelclear
  if (gameState === 'gameover' || gameState === 'levelclear') {
    for (let p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1;
      p.life -= p.decay;
    }
    particles = particles.filter(p => p.life > 0);
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ── 8-Bit Audio Engine ──────────────────
let audioCtx = null;
let bgmGain = null;
let sfxGain = null;
let bgmPlaying = false;
let bgmTimeout = null;

function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  // BGM channel
  bgmGain = audioCtx.createGain();
  bgmGain.gain.value = 0.30; // sensible default
  bgmGain.connect(audioCtx.destination);
  // SFX channel
  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.60; // sensible default
  sfxGain.connect(audioCtx.destination);
  // Load saved volumes (overrides defaults)
  loadVolumes();
  // Sync sliders
  syncSliders();
}

function resumeAudio() {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type, vol, slideTo, slideStart) {
  if (!audioCtx) return;
  resumeAudio();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo && slideStart) osc.frequency.linearRampToValueAtTime(slideTo, t + slideStart);
  gain.gain.setValueAtTime(vol || 0.15, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain); gain.connect(sfxGain || audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}

// Jump: quick rising chirp
function sfxJump() { playTone(400, 0.06, 'square', 0.12); setTimeout(() => playTone(800, 0.08, 'square', 0.10), 40); }

// Coin: two bright pings
function sfxCoin() { playTone(988, 0.06, 'square', 0.08); setTimeout(() => playTone(1319, 0.10, 'square', 0.08), 60); }

// Stomp: descending thud
function sfxStomp() { playTone(600, 0.04, 'square', 0.10); setTimeout(() => playTone(200, 0.10, 'triangle', 0.12), 30); }

// Hurt: noise burst
function sfxHurt() {
  if (!audioCtx) return; resumeAudio();
  const t = audioCtx.currentTime;
  for (let i = 0; i < 5; i++) {
    playTone(200 + Math.random() * 300, 0.06, 'square', 0.10);
    playTone(100 + Math.random() * 200, 0.06, 'sawtooth', 0.08);
  }
}

// Death: descending melody
function sfxDeath() {
  [400,350,300,250,200,150].forEach((f,i) => setTimeout(() => playTone(f, 0.12, 'square', 0.12), i*70));
}

// Level Clear: triumphant fanfare
function sfxLevelClear() {
  const notes = [523, 659, 784, 1047, 784, 1047];
  notes.forEach((f,i) => setTimeout(() => playTone(f, 0.18, 'square', 0.10), i*120));
}

// Power-up / question block hit
function sfxBlockHit() { playTone(600, 0.05, 'square', 0.08); setTimeout(() => playTone(900, 0.08, 'square', 0.08), 50); }

    [659,0.12],[0,0.06],[659,0.12],[0,0.06],[659,0.12],[0,0.06],[587,0.18],[0,0.06],
    // Bar 15-16: ending
    [587,0.12],[0,0.06],[587,0.12],[0,0.06],[523,0.12],[0,0.06],[494,0.12],[0,0.06],
    [440,0.12],[0,0.06],[494,0.24],[523,0.06],[0,0.06],[0,0.12],
  ];

  const bass = [
    [131,0.24],[131,0.24],[131,0.24],[131,0.24],
    [110,0.24],[110,0.24],[131,0.24],[131,0.24],
    [165,0.24],[165,0.24],[131,0.24],[131,0.24],
    [110,0.24],[110,0.24],[131,0.24],[131,0.24],
    [98,0.24],[98,0.24],[131,0.24],[131,0.24],
    [165,0.24],[165,0.24],[131,0.24],[131,0.24],
    [131,0.24],[131,0.24],[131,0.24],[131,0.24],
    [110,0.24],[110,0.24],[131,0.24],[220,0.12],[0,0.12],
  ];

  function scheduleLoop(notes, gainNode, type, vol, startOffset) {
    let time = audioCtx.currentTime + 0.1;
    for (let i = 0; i < notes.length; i++) {
      const [freq, dur] = notes[i];
      if (freq > 0 && vol > 0) {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, time);
        g.gain.setValueAtTime(vol, time);
        g.gain.exponentialRampToValueAtTime(0.0001, time + dur * 0.85);
        osc.connect(g); g.connect(gainNode);
        osc.start(time); osc.stop(time + dur);
      }
      time += dur;
    }
    return time - audioCtx.currentTime;
  }

  function playLoop() {
    if (!bgmPlaying) return;
    const bassG = audioCtx.createGain();
    bassG.gain.value = 0.18;
    bassG.connect(bgmGain);
    const leadG = audioCtx.createGain();
    leadG.gain.value = 0.22;
    leadG.connect(bgmGain);

    const leadDur = scheduleLoop(melody, leadG, 'square', 0.14, 0);
    const bassDur = scheduleLoop(bass, bassG, 'triangle', 0.22, 0);
    const loopLen = Math.max(leadDur, bassDur) * 1000 + 100;

    bgmTimeout = setTimeout(() => { playLoop(); }, loopLen);
  }

  playLoop();
}

function stopBGM() {
  bgmPlaying = false;
  if (bgmTimeout) { clearTimeout(bgmTimeout); bgmTimeout = null; }
}

// ── Volume settings ────────────────────
const VOL_BGM_KEY = 'mario_bgm_vol';
const VOL_SFX_KEY = 'mario_sfx_vol';

function loadVolumes() {
  try {
    const bgmV = localStorage.getItem(VOL_BGM_KEY);
    const sfxV = localStorage.getItem(VOL_SFX_KEY);
    if (bgmV !== null && bgmGain) bgmGain.gain.value = parseFloat(bgmV) / 100;
    if (sfxV !== null && sfxGain) sfxGain.gain.value = parseFloat(sfxV) / 100;
  } catch(e) { /* non-critical */ }
}

function saveVolume(key, val) {
  try { localStorage.setItem(key, val); } catch(e) {}
}

function syncSliders() {
  const bgmSlider = document.getElementById('bgm-vol');
  const sfxSlider = document.getElementById('sfx-vol');
  const spdSlider = document.getElementById('speed-mult');
  const jmpSlider = document.getElementById('jump-mult');
  if (bgmSlider && bgmGain) bgmSlider.value = Math.round(bgmGain.gain.value * 100);
  if (sfxSlider && sfxGain) sfxSlider.value = Math.round(sfxGain.gain.value * 100);
  if (spdSlider) spdSlider.value = Math.round(speedMult * 100);
  if (jmpSlider) jmpSlider.value = Math.round(jumpMult * 100);
  updateAllLabels();
}

function updateAllLabels() {
  const bgmV = document.getElementById('bgm-vol');
  const sfxV = document.getElementById('sfx-vol');
  const spdV = document.getElementById('speed-mult');
  const jmpV = document.getElementById('jump-mult');
  document.getElementById('bgm-vol-val').textContent = bgmV ? bgmV.value + '%' : '30%';
  document.getElementById('sfx-vol-val').textContent = sfxV ? sfxV.value + '%' : '60%';
  document.getElementById('speed-mult-val').textContent = spdV ? spdV.value + '%' : '100%';
  document.getElementById('jump-mult-val').textContent = jmpV ? jmpV.value + '%' : '100%';
}

function onBgmVolChange(v) {
  if (bgmGain) bgmGain.gain.value = v / 100;
  saveVolume(VOL_BGM_KEY, v);
  updateAllLabels();
}

function onSfxVolChange(v) {
  if (sfxGain) sfxGain.gain.value = v / 100;
  saveVolume(VOL_SFX_KEY, v);
  updateAllLabels();
}

// ── Speed / Jump settings ──────────────
const KEY_SPEED = 'mario_speed';
const KEY_JUMP  = 'mario_jump';

function loadSpeedJump() {
  try {
    const sv = localStorage.getItem(KEY_SPEED);
    const jv = localStorage.getItem(KEY_JUMP);
    speedMult = sv !== null ? parseFloat(sv) / 100 : 1.0;
    jumpMult  = jv !== null ? parseFloat(jv) / 100 : 1.0;
  } catch(e) {}
  const spdSlider = document.getElementById('speed-mult');
  const jmpSlider = document.getElementById('jump-mult');
  if (spdSlider) spdSlider.value = Math.round(speedMult * 100);
  if (jmpSlider) jmpSlider.value = Math.round(jumpMult * 100);
  updateAllLabels();
}

function onSpeedChange(v) {
  speedMult = v / 100;
  try { localStorage.setItem(KEY_SPEED, v); } catch(e) {}
  updateAllLabels();
}

function onJumpChange(v) {
  jumpMult = v / 100;
  try { localStorage.setItem(KEY_JUMP, v); } catch(e) {}
  updateAllLabels();
}

loadSpeedJump();

// Slider handlers
document.getElementById('bgm-vol').addEventListener('input', function(){ onBgmVolChange(this.value); });
document.getElementById('sfx-vol').addEventListener('input', function(){ onSfxVolChange(this.value); });
document.getElementById('speed-mult').addEventListener('input', function(){ onSpeedChange(this.value); });
document.getElementById('jump-mult').addEventListener('input', function(){ onJumpChange(this.value); });

// Settings panel toggle
const settingsScreen = document.getElementById('settings-screen');
document.getElementById('btn-settings').addEventListener('click', () => {
  if (!audioCtx) initAudio();
  syncSliders();
  settingsScreen.classList.add('active');
});

document.getElementById('btn-close-settings').addEventListener('click', () => {
  settingsScreen.classList.remove('active');
});

// Close settings on overlay click
settingsScreen.addEventListener('click', (e) => {
  if (e.target === settingsScreen) settingsScreen.classList.remove('active');
});

// ── Utility ────────────────────────────
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

// ── Return to menu ─────────────────────
document.getElementById('btn-return').addEventListener('click', () => {
  if (gameState === 'playing' || gameState === 'levelclear') {
    gameState = 'start'; stopBGM();
    startScreen.classList.add('active');
    levelClearScreen.classList.remove('active');
    gameoverScreen.classList.remove('active');
    buildLevelSelect();
  }
});

// ── Start ──────────────────────────────
preloadImages();
initGame();
gameLoop();
</script>
